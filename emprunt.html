<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bibliothèque - Emprunts</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="header">

    <div class="logo">
        📚 <span>Ma Bibliothèque</span>
    </div>


    <nav>

        <a href="index.html">
            Tableau de bord
        </a>

        <a href="livres.html">
            Livres
        </a>

        <a href="auteurs.html">
            Auteurs
        </a>

        <a href="adherents.html">
            Adhérents
        </a>

        <a href="emprunt.html" class="active">
            Emprunts
        </a>

    </nav>

</header>


<main class="container">


    <section class="page-header">

        <div>

            <h1>Gestion des emprunts</h1>

            <p>
                Suivez les livres actuellement empruntés.
            </p>

        </div>


        <button
            class="btn btn-primary"
            id="btn-ajouter-emprunt"
        >
            + Nouvel emprunt
        </button>

    </section>


    <!-- FILTRES -->

    <section class="tabs">

        <button class="tab active" data-filter="tous">
            Tous
        </button>

        <button class="tab" data-filter="encours">
            En cours
        </button>

        <button class="tab" data-filter="retard">
            En retard
        </button>

    </section>


    <!-- EMPRUNTS -->

    <section class="card">

        <div class="card-header">

            <h2>Liste des emprunts</h2>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Adhérent</th>
                        <th>Livre</th>
                        <th>Date emprunt</th>
                        <th>Retour prévu</th>
                        <th>Statut</th>
                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="liste-emprunts">

                    <!-- Emprunts injectés par JS -->


                    <!-- EXEMPLE -->

                 

                </tbody>

            </table>

        </div>

    </section>


</main>


<!-- MODAL EMPRUNT -->

<div class="modal" id="modal-emprunt">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Nouvel emprunt</h2>

            <button class="close-btn">
                &times;
            </button>

        </div>


        <form id="form-emprunt">


            <div class="form-group">

                <label for="emprunteur">
                    Adhérent
                </label>

                <select
                    id="emprunteur"
                    required
                >

                    <option value="">
                        Sélectionner un adhérent
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="livre-emprunt">
                    Livre
                </label>

                <select
                    id="livre-emprunt"
                    required
                >

                    <option value="">
                        Sélectionner un livre
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="date-retour">
                    Date de retour prévue
                </label>

                <input
                    type="date"
                    id="date-retour"
                    required
                >

            </div>


            <!-- MESSAGE ERREUR -->

            <div
                class="alert alert-danger"
                id="message-erreur"
                style="display: none;"
            >

                ⚠️ Ce livre est déjà emprunté.

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Enregistrer l'emprunt
                </button>

            </div>


        </form>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
