<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bibliothèque - Livres</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        📚 <span>Ma Bibliothèque</span>
    </div>

    <nav>
        <a href="index.html">Tableau de bord</a>
        <a href="livres.html" class="active">Livres</a>
        <a href="autheur.html">Auteurs</a>
        <a href="adherents.html">Adhérents</a>
        <a href="emprunt.html">Emprunts</a>
    </nav>

</header>


<main class="container">

    <section class="page-header">

        <div>
            <h1>Gestion des livres</h1>
            <p>Consultez et gérez les livres de la bibliothèque.</p>
        </div>

        <button class="btn btn-primary" id="btn-ajouter-livre">
            + Ajouter un livre
        </button>

    </section>


    <!-- RECHERCHE -->

    <section class="card search-card">

        <div class="search-box">

            <input
                type="text"
                id="search-livre"
                placeholder="Rechercher par titre ou auteur..."
            >

            <button class="btn btn-primary">
                 Rechercher
            </button>

        </div>

    </section>


    <!-- TABLEAU -->

    <section class="card">

        <div class="card-header">

            <h2>Liste des livres</h2>

            <span class="badge">
                <span id="nombre-livres">0</span> livres
            </span>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Titre</th>
                        <th>Auteur</th>
                        <th>Année</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="liste-livres">

                    <!-- Les livres seront ajoutés avec JavaScript -->

                </tbody>

            </table>

        </div>


        <!-- PAGINATION -->

        <div class="pagination">

            <button class="page-btn" data-page="previous">←</button>

            <button class="page-btn active" data-page="1">1</button>

            <button class="page-btn" data-page="2">2</button>

            <button class="page-btn" data-page="3">3</button>

            <button class="page-btn" data-page="next">→</button>

        </div>

    </section>

</main>


<!-- MODAL AJOUT LIVRE -->

<div class="modal" id="modal-livre">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Ajouter un livre</h2>

            <button class="close-btn">&times;</button>

        </div>


        <form id="form-livre">

            <div class="form-group">

                <label for="titre">
                    Titre
                </label>

                <input
                    type="text"
                    id="titre"
                    name="titre"
                    placeholder="Ex : Le Petit Prince"
                    required
                    
                >

            </div>
            <div class="form-group">
    <label for="nom_livres">Nom du livre (code)</label>
    <input type="text" id="nom_livres" name="nom_livres" placeholder="Ex : PETIT-PRINCE-43" required>
</div>

            <div class="form-group">

                <label for="auteur">
                    Auteur
                </label>

                <select id="auteur" name="auteur" required>

                    <option value="">
                        Sélectionner un auteur
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="annee">
                    Année de publication
                </label>

                <input
                    type="number"
                    id="annee"
                    name="annee"
                    placeholder="Ex : 1943"
                    required
                >

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Ajouter
                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/app.js"></script>

</body>
</html>
