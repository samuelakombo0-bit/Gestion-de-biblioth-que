<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bibliothèque - Auteurs</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        📚 <span>Ma Bibliothèque</span>
    </div>

    <nav>

        <a href="index.html">Tableau de bord</a>
        <a href="livres.html">Livres</a>
        <a href="autheur.html" class="active">Auteurs</a>
        <a href="adherents.html">Adhérents</a>
        <a href="emprunt.html">Emprunts</a>

    </nav>

</header>


<main class="container">

    <section class="page-header">

        <div>

            <h1>Gestion des auteurs</h1>

            <p>
                Gérez les auteurs enregistrés dans la bibliothèque.
            </p>

        </div>

        <button
            class="btn btn-primary"
            id="btn-ajouter-auteur"
        >
            + Ajouter un auteur
        </button>

    </section>


    <section class="card">

        <div class="card-header">

            <h2>Liste des auteurs</h2>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Nom</th>
                        <th>Nationalité</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="liste-auteurs">

                    <!-- Données injectées par JS -->

                </tbody>

            </table>

        </div>

    </section>


</main>


<!-- MODAL -->

<div class="modal" id="modal-auteur">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Ajouter un auteur</h2>

            <button class="close-btn">
                &times;
            </button>

        </div>


        <form id="form-auteur">

            <div class="form-group">

                <label for="nom-auteur">
                    Nom
                </label>

                <input
                    type="text"
                    id="nom-auteur"
                    placeholder="Ex : Victor Hugo"
                    required
                >

            </div>


            <div class="form-group">

                <label for="nationalite">
                    Nationalité
                </label>

                <input
                    type="text"
                    id="nationalite"
                    placeholder="Ex : Française"
                    required
                >

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Ajouter
                </button>

            </div>

        </form>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
