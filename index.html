<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque - Tableau de bord</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="logo">
         <span>Ma Bibliothèque</span>
    </div>

    <nav>
        <a href="index.html" class="active">Tableau de bord</a>
        <a href="livres.html">Livres</a>
        <a href="autheur.html">Auteurs</a>
        <a href="adherents.html">Adhérents</a>
        <a href="emprunt.html">Emprunts</a>
    </nav>
</header>

<main class="container">

    <section class="page-header">
        <div>
            <h1>Tableau de bord</h1>
            <p>Vue générale de l'activité de la bibliothèque.</p>
        </div>
    </section>


    <section class="stats-grid">

        <div class="stat-card">
            <div class="stat-icon"></div>
            <div>
                <p>Total livres</p>
                <h2 id="total-livres">0</h2>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon"></div>
            <div>
                <p>Total adhérents</p>
                <h2 id="total-adherents">0</h2>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon">=</div>
            <div>
                <p>Emprunts en cours</p>
                <h2 id="total-emprunts">0</h2>
            </div>
        </div>

        <div class="stat-card danger">
            <div class="stat-icon"></div>
            <div>
                <p>Emprunts en retard</p>
                <h2 id="total-retards">0</h2>
            </div>
        </div>

    </section>



    <section class="dashboard-grid">

        <div class="card">
            <div class="card-header">
                <h2> Livre le plus emprunté</h2>
            </div>

            <div class="highlight">
                <h3 id="livre-populaire"></h3>
                <p id="nombre-emprunts-livre"> </p>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2> Adhérent le plus actif</h2>
            </div>

            <div class="highlight">
                <h3 id="adherent-actif">Aucun adhérent</h3>
                <p id="nombre-emprunts-adherent"></p>
            </div>
        </div>

    </section>

</main>

<script src="js/app.js"></script>

</body>
</html>
